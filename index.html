<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi agenda</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f3f8;color:#17243a;font:15px system-ui}header{background:#14263f;color:white;padding:28px 5%}h1{margin:0;font-size:34px}main{padding:24px 5%}button,input,select{font:inherit;padding:10px;border:1px solid #ccd5e0;border-radius:8px;background:white}button{cursor:pointer}button.primary{background:#245bd8;color:white;border:0}form,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.board,.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.column,.stat{background:#e3e9f1;border-radius:14px;padding:16px}.stat{background:white}.stat b{display:block;font-size:30px}.task{background:white;padding:15px;border-radius:10px;margin:12px 0;border-left:4px solid #4576df;box-shadow:0 2px 5px #14263f12}.task small{display:block;color:#526783;margin:8px 0}.task select{max-width:100%}.task button{float:right;padding:5px 9px} @media(max-width:760px){.board{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}}body{background:#f5f7fb}header{margin-left:220px;background:white;color:#17243a;padding:28px 32px;border-bottom:1px solid #e5eaf2}header small{color:#64748b;letter-spacing:2px}header p{color:#64748b;margin-bottom:0}main{margin-left:220px;padding:26px 32px}aside{position:fixed;inset:0 auto 0 0;width:220px;background:#14263f;color:white;padding:28px 18px}aside h2{font-size:20px;margin:0 0 30px}aside button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;border:0;margin:4px 0}aside button.active,aside button:hover{background:#304867;color:white}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{border:1px solid #e4eaf2;box-shadow:0 4px 14px #14263f08;color:#64748b}.stat b{color:#17243a;font-size:32px}.column{background:#eaf0f7;min-height:320px}.column h2{font-size:16px;margin:0 0 18px}.column:nth-child(1) h2{color:#a16207}.column:nth-child(2) h2{color:#245bd8}.column:nth-child(3) h2{color:#15803d}.task{border:1px solid #e2e8f0;border-top:4px solid var(--accent,#4576df);padding:16px}.task small{display:inline-block;background:#eef2f7;border-radius:20px;padding:4px 9px;margin:12px 0}.task select{display:block;width:100%;font-size:13px}.task strong{display:block;padding-right:24px}.task button{color:#64748b;border:0}.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.task .meta select,.task .meta input{width:auto;max-width:100%;font-size:12px;padding:5px}.viewbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.viewbar button.active{background:#245bd8;color:white}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{background:white;border:1px solid #e2e8f0;border-radius:8px;min-height:100px;padding:8px;overflow-wrap:anywhere}.day p{font-size:12px;background:#eaf0ff;padding:5px;border-radius:5px}.history{background:white;padding:16px;border-radius:12px}.history p{border-bottom:1px solid #e2e8f0;padding:8px}@media(max-width:900px){aside{position:static;width:auto;display:flex;flex-wrap:wrap;gap:4px;padding:12px}aside h2{width:100%;margin:0}aside button{width:auto}header,main{margin-left:0;padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.calendar{grid-template-columns:repeat(2,1fr)}}</style><aside id="nav"><h2>◈ Mi agenda</h2><small>ÁREAS DE TRABAJO</small></aside><header><small>ORGANIZACIÓN COMERCIAL</small><h1>Mi agenda</h1><p>Planificación y seguimiento de tareas</p></header><main><div class="stats" id="stats"></div><form id="form"><input id="name" required placeholder="Nueva tarea"><select id="freq"><option>Diaria</option><option>Semanal</option><option>Mensual</option><option>Semestral</option><option>A demanda</option></select><button class="primary">+ Añadir tarea</button></form><div class="toolbar"><input id="search" placeholder="Buscar tarea"><select id="filter"><option>Todas</option><option>Diaria</option><option>Semanal</option><option>Mensual</option><option>Semestral</option><option>A demanda</option></select></div><div class="viewbar" id="views"></div><div class="board" id="board"></div><div id="extra"></div><p>Los cambios se guardan en este navegador. Las tareas recurrentes completadas se reabren al comenzar un nuevo período.</p></main><script>const initial=[["ABM · Altas","Diaria"],["ABM · Bajas","Semanal"],["Análisis Censo","Semestral"],["Análisis recurrente Censo","A demanda"],["Volumen · Carga de objetivos","Mensual"],["Volumen · Seguimiento","Diaria"],["Focos Patagonia · Carga de objetivos","Mensual"],["Focos Patagonia · Seguimiento","Diaria"],["Refrigerados · Carga de objetivos","Mensual"],["Refrigerados · Seguimiento","Diaria"],["Bees One · Actualización","Semanal"],["Bees One · Feriados","A demanda"],["Cartera de clientes","Semanal"]].map(([name,freq],id)=>({name,freq,id,status:0}));let data;try{data=JSON.parse(localStorage.getItem('mi-agenda-v1'))||initial}catch{data=initial}const $=id=>document.getElementById(id),labels=['Pendientes','En curso','Completadas'];let category='Todas',view='Kanban';const categories=['Todas','ABM','Censo','Objetivos','Bees One','Cartera','Otras'];function cat(t){return t.name.startsWith('ABM')?'ABM':t.name.includes('Censo')?'Censo':/Volumen|Patagonia|Refrigerados/.test(t.name)?'Objetivos':t.name.startsWith('Bees')?'Bees One':t.name.startsWith('Cartera')?'Cartera':'Otras'}const today=()=>new Date();function period(f,d){let y=d.getFullYear(),m=d.getMonth();if(f==='Diaria')return d.toDateString();if(f==='Semanal'){let a=new Date(y,m,d.getDate()-((d.getDay()+6)%7));return a.toDateString()}if(f==='Mensual')return y+'-'+m;if(f==='Semestral')return y+'-'+Math.floor(m/6);return ''}let history;try{history=JSON.parse(localStorage.getItem('mi-agenda-history'))||[]}catch{history=[]}function status(t,i){if(t.status!==2&&i===2){t.completed=new Date().toISOString();history.unshift({name:t.name,date:t.completed});localStorage.setItem('mi-agenda-history',JSON.stringify(history))}t.status=i;save()}function renew(){let changed=false;data.forEach(t=>{if(t.status===2&&t.freq!=='A demanda'){if(!t.completed){t.completed=new Date().toISOString();changed=true}else if(period(t.freq,new Date(t.completed))!==period(t.freq,today())){t.status=0;changed=true}}});if(changed)localStorage.setItem('mi-agenda-v1',JSON.stringify(data))}renew();setInterval(()=>{renew();render()},60000);function visible(t){return (category==='Todas'||cat(t)===category)&&t.name.toLowerCase().includes($('search').value.toLowerCase())&&($('filter').value==='Todas'||t.freq===$('filter').value)}function save(){localStorage.setItem('mi-agenda-v1',JSON.stringify(data));render()}function render(){$('stats').replaceChildren();$('board').replaceChildren();$('extra').replaceChildren();$('nav').querySelectorAll('button').forEach(b=>b.remove());categories.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;render()};$('nav').append(b)});$('views').replaceChildren();['Kanban','Semanal','Mensual','Histórico'].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.className=v===view?'active':'';b.onclick=()=>{view=v;render()};$('views').append(b)});labels.forEach((label,i)=>{let stat=document.createElement('div');stat.className='stat';let b=document.createElement('b');b.textContent=data.filter(t=>t.status===i).length;stat.append(b,label);$('stats').append(stat);let col=document.createElement('section');col.className='column';let h=document.createElement('h2');h.textContent=label;col.append(h);col.ondragover=e=>e.preventDefault();col.ondrop=e=>{e.preventDefault();let t=data.find(t=>String(t.id)===e.dataTransfer.getData('text/plain'));if(t){status(t,i)}};data.filter(t=>t.status===i&&visible(t)).forEach(t=>{let card=document.createElement('article');card.className='task';card.draggable=true;card.ondragstart=e=>e.dataTransfer.setData('text/plain',String(t.id));let title=document.createElement('strong');title.textContent=t.name;let del=document.createElement('button');del.textContent='×';del.title='Eliminar';del.onclick=()=>{if(confirm('¿Eliminar tarea?')){data=data.filter(x=>x!==t);save()}};let small=document.createElement('small');small.textContent=t.freq;let sel=document.createElement('select');labels.forEach((l,j)=>sel.add(new Option(l,j)));sel.value=t.status;sel.onchange=()=>status(t,+sel.value);card.style.setProperty('--accent',({Diaria:'#2563eb',Semanal:'#0d9488',Mensual:'#9333ea',Semestral:'#d97706'})[t.freq]||'#64748b');let meta=document.createElement('div');meta.className='meta';let pri=document.createElement('select');['Normal','Alta','Baja'].forEach(p=>pri.add(new Option(p,p)));pri.value=t.priority||'Normal';pri.onchange=()=>{t.priority=pri.value;save()};let due=document.createElement('input');due.type='date';due.value=t.due||'';due.title='Vencimiento';due.onchange=()=>{t.due=due.value;save()};let edit=document.createElement('button');edit.textContent='Editar';edit.onclick=()=>{let n=prompt('Nombre de tarea',t.name);if(n&&n.trim()){t.name=n.trim();save()}};meta.append(pri,due,edit);card.append(del,title,small,meta,sel);col.append(card)});$('board').append(col)});let stat=document.createElement('div');stat.className='stat';let b=document.createElement('b');b.textContent=(data.length?Math.round(100*data.filter(t=>t.status===2).length/data.length):0)+'%';stat.append(b,'Cumplimiento');$('stats').append(stat);$('board').hidden=view!=='Kanban';$('board').style.display=view==='Kanban'?'grid':'none';if(view==='Histórico'){let box=document.createElement('div');box.className='history';history.forEach(t=>{let p=document.createElement('p');p.textContent=new Date(t.date).toLocaleString('es-AR')+' · '+t.name;box.append(p)});if(!history.length)box.textContent='Sin registros nuevos de finalización';$('extra').append(box)}else if(view!=='Kanban'){let now=today(),start=view==='Semanal'?new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)):new Date(now.getFullYear(),now.getMonth(),1),n=view==='Semanal'?7:new Date(now.getFullYear(),now.getMonth()+1,0).getDate();let box=document.createElement('div');box.className='calendar';for(let i=0;i<n;i++){let d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let cell=document.createElement('div');cell.className='day';cell.textContent=d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric'});data.filter(t=>visible(t)&&t.due===key).forEach(t=>{let p=document.createElement('p');p.textContent=t.name;cell.append(p)});box.append(cell)}$('extra').append(box);let note=document.createElement('p');note.textContent='Calendario del período actual · muestra tareas con vencimiento asignado.';$('extra').append(note)}}$('form').onsubmit=e=>{e.preventDefault();data.push({id:Date.now(),name:$('name').value.trim(),freq:$('freq').value,status:0});$('name').value='';save()};$('search').oninput=render;$('filter').onchange=render;render();</script></html>
