<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi agenda</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f3f8;color:#17243a;font:15px system-ui}header{background:#14263f;color:white;padding:28px 5%}h1{margin:0;font-size:34px}main{padding:24px 5%}button,input,select{font:inherit;padding:10px;border:1px solid #ccd5e0;border-radius:8px;background:white}button{cursor:pointer}button.primary{background:#245bd8;color:white;border:0}form,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.board,.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.column,.stat{background:#e3e9f1;border-radius:14px;padding:16px}.stat{background:white}.stat b{display:block;font-size:30px}.task{background:white;padding:15px;border-radius:10px;margin:12px 0;border-left:4px solid #4576df;box-shadow:0 2px 5px #14263f12}.task small{display:block;color:#526783;margin:8px 0}.task select{max-width:100%}.task button{float:right;padding:5px 9px} @media(max-width:760px){.board{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}}</style><header><small>ORGANIZACIÓN COMERCIAL</small><h1>Mi agenda</h1><p>Planificación y seguimiento de tareas</p></header><main><div class="stats" id="stats"></div><form id="form"><input id="name" required placeholder="Nueva tarea"><select id="freq"><option>Diaria</option><option>Semanal</option><option>Mensual</option><option>Semestral</option><option>A demanda</option></select><button class="primary">+ Añadir tarea</button></form><div class="toolbar"><input id="search" placeholder="Buscar tarea"><select id="filter"><option>Todas</option><option>Diaria</option><option>Semanal</option><option>Mensual</option><option>Semestral</option><option>A demanda</option></select></div><div class="board" id="board"></div><p>Los cambios se guardan en este navegador. Las frecuencias son etiquetas de planificación.</p></main><script>const initial=[["ABM · Altas","Diaria"],["ABM · Bajas","Semanal"],["Análisis Censo","Semestral"],["Análisis recurrente Censo","A demanda"],["Volumen · Carga de objetivos","Mensual"],["Volumen · Seguimiento","Diaria"],["Focos Patagonia · Carga de objetivos","Mensual"],["Focos Patagonia · Seguimiento","Diaria"],["Refrigerados · Carga de objetivos","Mensual"],["Refrigerados · Seguimiento","Diaria"],["Bees One · Actualización","Semanal"],["Bees One · Feriados","A demanda"],["Cartera de clientes","Semanal"]].map(([name,freq],id)=>({name,freq,id,status:0}));let data;try{data=JSON.parse(localStorage.getItem('mi-agenda-v1'))||initial}catch{data=initial}const $=id=>document.getElementById(id),labels=['Pendientes','En curso','Completadas'];function save(){localStorage.setItem('mi-agenda-v1',JSON.stringify(data));render()}function render(){$('stats').replaceChildren();$('board').replaceChildren();labels.forEach((label,i)=>{let stat=document.createElement('div');stat.className='stat';let b=document.createElement('b');b.textContent=data.filter(t=>t.status===i).length;stat.append(b,label);$('stats').append(stat);let col=document.createElement('section');col.className='column';let h=document.createElement('h2');h.textContent=label;col.append(h);col.ondragover=e=>e.preventDefault();col.ondrop=e=>{e.preventDefault();let t=data.find(t=>String(t.id)===e.dataTransfer.getData('text/plain'));if(t){t.status=i;save()}};data.filter(t=>t.status===i&&t.name.toLowerCase().includes($('search').value.toLowerCase())&&($('filter').value==='Todas'||t.freq===$('filter').value)).forEach(t=>{let card=document.createElement('article');card.className='task';card.draggable=true;card.ondragstart=e=>e.dataTransfer.setData('text/plain',String(t.id));let title=document.createElement('strong');title.textContent=t.name;let del=document.createElement('button');del.textContent='×';del.title='Eliminar';del.onclick=()=>{if(confirm('¿Eliminar tarea?')){data=data.filter(x=>x!==t);save()}};let small=document.createElement('small');small.textContent=t.freq;let sel=document.createElement('select');labels.forEach((l,j)=>sel.add(new Option(l,j)));sel.value=t.status;sel.onchange=()=>{t.status=+sel.value;save()};card.append(del,title,small,sel);col.append(card)});$('board').append(col)})}$('form').onsubmit=e=>{e.preventDefault();data.push({id:Date.now(),name:$('name').value.trim(),freq:$('freq').value,status:0});$('name').value='';save()};$('search').oninput=render;$('filter').onchange=render;render();</script></html>
